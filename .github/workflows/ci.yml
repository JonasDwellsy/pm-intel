name: CI

# Runs the type-check + node:test suite on every PR and on pushes to main.
#
# Why this exists: the node:test suite (`npm run test:watch-list`, 455 tests)
# was not part of any automatic path — only `tsc`/`eslint` were ever run by
# hand. That let an intentional behavior change (gating market briefs) silently
# orphan its tests, which sat red on main for weeks. This workflow makes the
# tests a gate so that class of drift can't recur.
#
# Scope note: repo-wide `eslint .` is intentionally NOT run here yet — it
# currently reports ~40 pre-existing errors (mostly in /dev pages + `any`
# types) that predate this workflow. Adding lint to CI is a separate cleanup:
# fix those first, then add an `npm run lint -- .` step.
#
# No secrets/DB needed: the tests are pure/source-level (they read source and
# assert on it, or exercise pure logic), and both `prisma generate` and `tsc`
# run offline. If a future test needs a database, add a Postgres service +
# DATABASE_URL here.

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc imports @prisma/client types, which are code-generated from the
      # schema. Generate reads prisma/schema.prisma only — no DB connection.
      - name: Generate Prisma client
        run: npx prisma generate

      # The --max-old-space-size=8192 workaround that used to live here is gone:
      # prisma/seed.ts now reads the seed at runtime instead of importing it, so
      # the blob is out of tsc's type graph entirely. Peak RSS went 2.84 GB ->
      # 0.87 GB, comfortably inside Node's default heap. If this ever OOMs again,
      # something has re-introduced a static import of a large JSON file — fix
      # that rather than raising the cap.
      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (node:test)
        run: npm run test:watch-list

      # Component/interaction tests run under a SEPARATE runner (Vitest +
      # happy-dom, scoped to *.test.tsx) so they never overlap the node:test
      # lib suite (*.test.ts). Without this step the harness would be dead
      # infra — merged but never enforced.
      - name: Component tests (Vitest + Testing Library)
        run: npm run test:components

  seed-atomicity:
    name: Seed atomicity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seed_atomicity
          POSTGRES_USER: seed_test
          POSTGRES_PASSWORD: seed_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seed_test -d seed_atomicity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://seed_test:seed_test_password@localhost:5432/seed_atomicity
      DATABASE_URL_UNPOOLED: postgresql://seed_test:seed_test_password@localhost:5432/seed_atomicity
      SEED_TEST_DATABASE_URL: postgresql://seed_test:seed_test_password@localhost:5432/seed_atomicity
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create disposable schema
        run: npx prisma migrate deploy

      - name: Prove interrupted seeds roll back
        run: npm run test:seed-atomicity
