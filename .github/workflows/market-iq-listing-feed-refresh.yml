name: Market IQ listing feed refresh

on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch:

concurrency:
  group: market-iq-listing-feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Capture verified Market IQ listing supply
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      EXPECTED_BRANCH: codex/market-iq-integration
      IDENTITY_URL: https://market-preview.intel.iq.dwellsy.com/api/market-iq-deployment-identity
      REFRESH_URL: https://market-preview.intel.iq.dwellsy.com/api/market-iq/source/dwellsy/refresh
      HEALTH_URL: https://market-preview.intel.iq.dwellsy.com/api/market-iq-stable-preview-health
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET }}
      MARKET_IQ_SOURCE_REFRESH_TOKEN: ${{ secrets.MARKET_IQ_SOURCE_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require purpose-scoped automation credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi
          if [ -z "$MARKET_IQ_SOURCE_REFRESH_TOKEN" ]; then
            echo "MARKET_IQ_SOURCE_REFRESH_TOKEN is not configured."
            exit 1
          fi

      - name: Verify the stable preview serves integration HEAD
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          expected_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BRANCH" --jq '.object.sha')"
          status="$(curl --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$IDENTITY_URL")"

          EXPECTED_SHA="$expected_sha" IDENTITY_STATUS="$status" IDENTITY_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");

          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.IDENTITY_RESPONSE_FILE, "utf8"));
          } catch {
            console.error("Market IQ deployment identity did not return valid JSON.");
            process.exit(1);
          }

          const ready = process.env.IDENTITY_STATUS === "200"
            && response.product === "market-iq"
            && response.branch === process.env.EXPECTED_BRANCH
            && response.commit === process.env.EXPECTED_SHA;
          if (!ready) {
            console.error("Stable Market IQ preview is not serving integration HEAD.", {
              httpStatus: process.env.IDENTITY_STATUS,
              product: response.product,
              branch: response.branch,
              expectedCommit: process.env.EXPECTED_SHA,
              observedCommit: response.commit,
            });
            process.exit(1);
          }

          console.log(`Stable Market IQ preview is serving ${response.branch} at ${response.commit}.`);
          NODE

      - name: Capture the active listing feed once
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --request POST \
            --connect-timeout 10 --max-time 330 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "authorization: Bearer $MARKET_IQ_SOURCE_REFRESH_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$REFRESH_URL")"

          REFRESH_STATUS="$status" REFRESH_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");

          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.REFRESH_RESPONSE_FILE, "utf8"));
          } catch {
            console.error("Market IQ listing refresh did not return valid JSON.");
            process.exit(1);
          }

          const successfulStatuses = new Set(["complete", "baseline_complete"]);
          const healthy = process.env.REFRESH_STATUS === "200"
            && successfulStatuses.has(response.status)
            && Number.isInteger(response.recordCount)
            && response.recordCount >= 250
            && response.apartmentCount + response.houseCount === response.recordCount;

          const summary = [
            "## Market IQ listing feed refresh",
            "",
            `- HTTP status: ${process.env.REFRESH_STATUS}`,
            `- Refresh status: ${response.status ?? "unavailable"}`,
            `- Source available through: ${response.sourceAvailableThrough ?? "unavailable"}`,
            `- Active listings: ${response.recordCount ?? "unavailable"}`,
            `- Apartments: ${response.apartmentCount ?? "unavailable"}`,
            `- Houses: ${response.houseCount ?? "unavailable"}`,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);

          if (!healthy) {
            console.error("Market IQ listing refresh did not produce a valid completed capture.", {
              httpStatus: process.env.REFRESH_STATUS,
              status: response.status,
              recordCount: response.recordCount,
            });
            process.exit(1);
          }

          console.log(`Captured ${response.recordCount} verified active listings.`);
          NODE

      - name: Verify persisted listing health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$HEALTH_URL")"

          HEALTH_STATUS="$status" HEALTH_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");

          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.HEALTH_RESPONSE_FILE, "utf8"));
          } catch {
            console.error("Market IQ health did not return valid JSON.");
            process.exit(1);
          }

          const checks = Array.isArray(response.checks) ? response.checks : [];
          const listingCheckIds = new Set(["listing_snapshot", "listing_refresh_attempt"]);
          const listingChecks = checks.filter((check) => listingCheckIds.has(check.id));
          const failedChecks = listingChecks.filter((check) => check.status !== "ready");
          const healthy = ["200", "503"].includes(process.env.HEALTH_STATUS)
            && response.product === "market-iq"
            && listingChecks.length === listingCheckIds.size
            && failedChecks.length === 0;

          const summary = [
            "",
            "### Persisted listing health",
            "",
            `- Snapshot captured at: ${response.listingSnapshotCapturedAt ?? "unavailable"}`,
            `- Listing source available through: ${response.listingSourceAvailableThrough ?? "unavailable"}`,
            `- Latest listing refresh: ${response.latestListingRefreshStatus ?? "unavailable"}`,
            `- Failed listing checks: ${failedChecks.map((check) => check.id).join(", ") || "none"}`,
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary}\n`);

          if (!healthy) {
            console.error("Persisted Market IQ listing health is blocked after refresh.", {
              httpStatus: process.env.HEALTH_STATUS,
              product: response.product,
              failedChecks: failedChecks.map((check) => check.id),
            });
            process.exit(1);
          }

          console.log("Persisted Market IQ listing evidence is current and structurally valid.");
          NODE
