name: Market IQ nightly source snapshots and delivery

on:
  schedule:
    # 09:00 UTC is 2:00 a.m. PDT and 1:00 a.m. PST.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: market-iq-nightly-source-snapshots
  cancel-in-progress: false

jobs:
  verify:
    name: Publish, verify, and deliver every Market IQ snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPECTED_BRANCH: codex/market-iq-integration
      AUTOMATION_ORIGIN: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app
      IDENTITY_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq-deployment-identity
      HEALTH_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq-stable-preview-health
      REFRESH_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq/source/trends/refresh
      SUPPLY_REFRESH_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq/source/dwellsy/refresh
      NATIONAL_SUPPLY_REFRESH_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq/source/dwellsy/national-supply
      DELIVERY_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq/daily-watchlist-delivery
      MARKET_IQ_SOURCE_REFRESH_TOKEN: ${{ secrets.MARKET_IQ_SOURCE_REFRESH_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the preview automation credentials
        shell: bash
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || [ -z "$MARKET_IQ_SOURCE_REFRESH_TOKEN" ]; then
            echo "The Market IQ snapshot automation credentials are not configured."
            exit 1
          fi

      - name: Verify the Market IQ integration deployment
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          expected_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BRANCH" --jq '.object.sha')"
          status="$(curl --silent --show-error --location \
            --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$IDENTITY_URL")"

          EXPECTED_SHA="$expected_sha" IDENTITY_STATUS="$status" IDENTITY_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.IDENTITY_RESPONSE_FILE, "utf8"));
          } catch {
            console.error("The Market IQ integration deployment did not return a valid identity response.");
            process.exit(1);
          }
          const ready = process.env.IDENTITY_STATUS === "200"
            && response.product === "market-iq"
            && response.branch === process.env.EXPECTED_BRANCH
            && response.commit === process.env.EXPECTED_SHA;
          if (!ready) {
            console.error("The nightly loader refused to write through an unexpected deployment.", {
              httpStatus: process.env.IDENTITY_STATUS,
              branch: response.branch,
              expectedCommit: process.env.EXPECTED_SHA,
              observedCommit: response.commit,
            });
            process.exit(1);
          }
          console.log(`Verified ${response.branch} at ${response.commit}.`);
          NODE

      - name: Publish every configured market snapshot
        shell: bash
        run: |
          set -euo pipefail
          markets=(
            "cleveland-elyria-mentor-oh"
            "columbus-oh"
            "san-francisco-oakland-berkeley-ca"
            "san-jose-sunnyvale-santa-clara-ca"
          )

          for market_id in "${markets[@]}"; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 360 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $MARKET_IQ_SOURCE_REFRESH_TOKEN" \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$REFRESH_URL?market=$market_id")"

            MARKET_ID="$market_id" HTTP_STATUS="$status" RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          const marketId = process.env.MARKET_ID;
          const httpStatus = process.env.HTTP_STATUS;
          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, "utf8"));
          } catch {
            console.error(`Snapshot refresh for ${marketId} did not return valid JSON.`);
            process.exit(1);
          }

          const generatedAt = new Date(response.generatedAt);
          const ageMilliseconds = Date.now() - generatedAt.getTime();
          const stored = httpStatus === "200"
            && response.status === "stored"
            && response.marketId === marketId
            && Number.isFinite(generatedAt.getTime())
            && ageMilliseconds >= 0
            && ageMilliseconds <= 20 * 60 * 1000;

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `### ${marketId}`,
            "",
            `- HTTP status: ${httpStatus}`,
            `- Result: ${response.status ?? "unavailable"}`,
            `- Source available through: ${response.sourceAvailableThrough ?? "unavailable"}`,
            `- Snapshot generated at: ${response.generatedAt ?? "unavailable"}`,
            "",
          ].join("\n"));

          if (!stored) {
            console.error(`Snapshot refresh for ${marketId} failed its stored-snapshot contract.`);
            process.exit(1);
          }
          NODE
            rm -f "$response_file"
          done

      - name: Capture national supply history before markets launch
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          metadata="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 360 \
            --output "$response_file" --write-out $'%{http_code}\t%{content_type}' \
            --request POST \
            --header "Authorization: Bearer $MARKET_IQ_SOURCE_REFRESH_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$NATIONAL_SUPPLY_REFRESH_URL")"
          IFS=$'\t' read -r status content_type <<< "$metadata"

          HTTP_STATUS="$status" CONTENT_TYPE="$content_type" RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          const responseText = fs.readFileSync(process.env.RESPONSE_FILE, "utf8");
          const bodyBytes = Buffer.byteLength(responseText);
          const contentType = (process.env.CONTENT_TYPE || "unavailable")
            .replace(/[^\x20-\x7e]/g, "?")
            .slice(0, 160);
          let response;
          try {
            response = JSON.parse(responseText);
          } catch {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## National listing supply",
              "",
              `- HTTP status: ${process.env.HTTP_STATUS}`,
              `- Content type: ${contentType}`,
              `- Response bytes: ${bodyBytes}`,
              "- Result: invalid JSON response; body withheld",
              "",
            ].join("\n"));
            console.error(
              `National listing-supply capture returned invalid JSON `
              + `(HTTP ${process.env.HTTP_STATUS}, content-type ${contentType}, ${bodyBytes} bytes). `
              + "The response body was withheld.",
            );
            process.exit(1);
          }
          const capturedAt = new Date(response.capturedAt);
          const captureAge = Date.now() - capturedAt.getTime();
          const captured = process.env.HTTP_STATUS === "200"
            && response.status === "stored"
            && Number.isInteger(response.totalMarkets)
            && response.totalMarkets > 4
            && Number.isInteger(response.eligibleMarkets)
            && response.eligibleMarkets >= 4
            && response.trackedMarketCount === 25
            && response.trackedMarketsObserved === 25
            && Number.isFinite(capturedAt.getTime())
            && captureAge >= 0
            && captureAge <= 20 * 60 * 1000;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## National listing supply",
            "",
            `- HTTP status: ${process.env.HTTP_STATUS}`,
            `- Content type: ${contentType}`,
            `- Response bytes: ${bodyBytes}`,
            `- Result: ${response.status ?? "unavailable"}`,
            `- Markets observed: ${response.totalMarkets ?? "unavailable"}`,
            `- Markets eligible to publish: ${response.eligibleMarkets ?? "unavailable"}`,
            `- Selected markets observed: ${response.trackedMarketsObserved ?? "unavailable"} / ${response.trackedMarketCount ?? "unavailable"}`,
            `- Selected markets eligible: ${response.trackedEligibleMarkets ?? "unavailable"}`,
            `- Insufficient coverage: ${response.insufficientMarkets ?? "unavailable"}`,
            `- Stale source: ${response.staleMarkets ?? "unavailable"}`,
            `- Invalid aggregates: ${response.invalidMarkets ?? "unavailable"}`,
            "",
          ].join("\n"));
          if (!captured) {
            console.error("National listing-supply capture failed its persisted-evidence contract.");
            process.exit(1);
          }
          NODE

      - name: Capture detailed listing events for launched markets
        shell: bash
        run: |
          set -euo pipefail
          markets=(
            "cleveland-elyria-mentor-oh"
            "columbus-oh"
            "san-francisco-oakland-berkeley-ca"
            "san-jose-sunnyvale-santa-clara-ca"
          )

          for market_id in "${markets[@]}"; do
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 360 \
              --output "$response_file" --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $MARKET_IQ_SOURCE_REFRESH_TOKEN" \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$SUPPLY_REFRESH_URL?market=$market_id")"

            MARKET_ID="$market_id" HTTP_STATUS="$status" RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          const marketId = process.env.MARKET_ID;
          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, "utf8"));
          } catch {
            console.error(`Listing supply capture for ${marketId} did not return valid JSON.`);
            process.exit(1);
          }
          const captured = process.env.HTTP_STATUS === "200"
            && response.marketId === marketId
            && ["complete", "baseline_complete"].includes(response.status)
            && Number.isInteger(response.recordCount)
            && response.recordCount > 0;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            `### ${marketId} listing supply`,
            "",
            `- HTTP status: ${process.env.HTTP_STATUS}`,
            `- Result: ${response.status ?? "unavailable"}`,
            `- Active listings: ${response.recordCount ?? "unavailable"}`,
            `- Source available through: ${response.sourceAvailableThrough ?? "unavailable"}`,
            "",
          ].join("\n"));
          if (!captured) {
            console.error(`Listing supply capture for ${marketId} failed its persisted-evidence contract.`);
            process.exit(1);
          }
          NODE
            rm -f "$response_file"
          done

      - name: Check the verified source snapshot
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --retry 2 --retry-all-errors --retry-delay 5 \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$HEALTH_URL")"

          HEALTH_STATUS="$status" HEALTH_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.HEALTH_RESPONSE_FILE, "utf8"));
          } catch {
            console.error("Market IQ source health did not return valid JSON.");
            process.exit(1);
          }
          const checks = Array.isArray(response.checks) ? response.checks : [];
          const failedChecks = checks.filter((check) => check.status !== "ready");
          const healthy = process.env.HEALTH_STATUS === "200"
            && response.product === "market-iq"
            && response.status === "ready"
            && checks.length > 0
            && failedChecks.length === 0;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Market IQ post-publication health",
            "",
            `- HTTP status: ${process.env.HEALTH_STATUS}`,
            `- Overall status: ${response.status ?? "unavailable"}`,
            `- Failed checks: ${failedChecks.map((check) => check.id).join(", ") || "none"}`,
            "",
          ].join("\n"));
          if (!healthy) {
            console.error("Market IQ does not have a current verified source snapshot.");
            process.exit(1);
          }
          NODE

      - name: Materialize and deliver personal watchlist matches
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 360 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $MARKET_IQ_SOURCE_REFRESH_TOKEN" \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$DELIVERY_URL")"

          DELIVERY_STATUS="$status" DELIVERY_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          let response;
          try {
            response = JSON.parse(fs.readFileSync(process.env.DELIVERY_RESPONSE_FILE, "utf8"));
          } catch {
            console.error("Market IQ watchlist delivery did not return valid JSON.");
            process.exit(1);
          }
          const complete = process.env.DELIVERY_STATUS === "200" && response.status === "complete";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "## Personal watchlist delivery",
            "",
            `- HTTP status: ${process.env.DELIVERY_STATUS}`,
            `- Result: ${response.status ?? "unavailable"}`,
            `- Watchlists evaluated: ${response.watchlistsEvaluated ?? "unavailable"}`,
            `- New matches: ${response.matchesCreated ?? "unavailable"}`,
            `- Emails sent: ${response.sent ?? "unavailable"}`,
            `- Failed emails: ${response.failed ?? "unavailable"}`,
            "",
          ].join("\n"));
          if (!complete) {
            console.error("Market IQ watchlist delivery did not complete.");
            process.exit(1);
          }
          NODE
