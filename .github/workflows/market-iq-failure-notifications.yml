name: Market IQ failure notifications

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Market IQ listing feed refresh
      - Market IQ source staleness
      - Market IQ stable preview identity
    types: [completed]

concurrency:
  group: market-iq-failure-notifications
  cancel-in-progress: false

jobs:
  monitor:
    name: Reconcile the Market IQ preview incident
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      EXPECTED_BRANCH: codex/market-iq-integration
      IDENTITY_URL: https://market-preview.intel.iq.dwellsy.com/api/market-iq-deployment-identity
      HEALTH_URL: https://market-preview.intel.iq.dwellsy.com/api/market-iq-stable-preview-health
      PREVIEW_ORIGIN: https://market-preview.intel.iq.dwellsy.com
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect the latest automation runs
        id: automation
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeMs = 30 * 60 * 60 * 1000;
            const checks = [];

            async function inspectDefaultBranchWorkflow(id, label) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: id,
                  branch: "main",
                  status: "completed",
                  per_page: 1,
                });
                const run = data.workflow_runs[0];
                if (!run) {
                  checks.push({ id, label, ready: false, detail: "No completed run is recorded." });
                  return;
                }

                const ageMs = Date.now() - Date.parse(run.updated_at);
                const ready = run.conclusion === "success" && ageMs <= maxAgeMs;
                checks.push({
                  id,
                  label,
                  ready,
                  detail: `${run.conclusion ?? "unknown"}; completed ${run.updated_at}; ${run.html_url}`,
                });
              } catch (error) {
                checks.push({ id, label, ready: false, detail: `Run lookup failed: ${error.message}` });
              }
            }

            await inspectDefaultBranchWorkflow(
              "market-iq-listing-feed-refresh.yml",
              "Listing feed refresh automation",
            );
            await inspectDefaultBranchWorkflow(
              "market-iq-source-staleness.yml",
              "Source staleness automation",
            );

            try {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: process.env.EXPECTED_BRANCH,
                status: "completed",
                per_page: 100,
              });
              const run = runs.find((candidate) => candidate.name === "Market IQ stable preview identity");
              checks.push(run
                ? {
                    id: "market-iq-stable-preview.yml",
                    label: "Stable preview identity automation",
                    ready: run.conclusion === "success",
                    detail: `${run.conclusion ?? "unknown"}; completed ${run.updated_at}; ${run.html_url}`,
                  }
                : {
                    id: "market-iq-stable-preview.yml",
                    label: "Stable preview identity automation",
                    ready: false,
                    detail: "No completed integration-branch run is recorded.",
                  });
            } catch (error) {
              checks.push({
                id: "market-iq-stable-preview.yml",
                label: "Stable preview identity automation",
                ready: false,
                detail: `Run lookup failed: ${error.message}`,
              });
            }

            const ready = checks.every((check) => check.ready);
            core.setOutput("ready", String(ready));
            core.setOutput("checks", JSON.stringify(checks));
            await core.summary
              .addHeading("Market IQ automation history", 2)
              .addTable([
                [
                  { data: "Automation", header: true },
                  { data: "State", header: true },
                  { data: "Latest completed run", header: true },
                ],
                ...checks.map((check) => [
                  check.label,
                  check.ready ? "Ready" : "Blocked",
                  check.detail,
                ]),
              ])
              .write();

            if (!ready) {
              core.setFailed("One or more Market IQ automation runs are failed, missing, or stale.");
            }

      - name: Verify the stable preview directly
        id: preview
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          expected_sha="$(gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$EXPECTED_BRANCH" --jq '.object.sha')"
          EXPECTED_SHA="$expected_sha" node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const checks = [];
          const bypass = process.env.VERCEL_AUTOMATION_BYPASS_SECRET;
          const headers = bypass ? { "x-vercel-protection-bypass": bypass } : {};

          async function check(id, label, operation) {
            try {
              const detail = await operation();
              checks.push({ id, label, ready: true, detail });
            } catch (error) {
              checks.push({ id, label, ready: false, detail: error.message });
            }
          }

          if (!bypass) {
            checks.push({
              id: "automation_credential",
              label: "Preview automation credential",
              ready: false,
              detail: "MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET is not configured.",
            });
          } else {
            await check("deployment_identity", "Deployment identity", async () => {
              const response = await fetch(process.env.IDENTITY_URL, {
                headers,
                signal: AbortSignal.timeout(30_000),
              });
              assert.equal(response.status, 200, `Identity endpoint returned HTTP ${response.status}.`);
              const body = await response.json();
              assert.equal(body.product, "market-iq", "Identity endpoint reported the wrong product.");
              assert.equal(body.branch, process.env.EXPECTED_BRANCH, "Stable preview reported the wrong branch.");
              assert.equal(body.commit, process.env.EXPECTED_SHA, "Stable preview is not serving integration HEAD.");
              return `${body.branch} at ${body.commit}`;
            });

            await check("source_health", "Verified source health", async () => {
              const response = await fetch(process.env.HEALTH_URL, {
                headers,
                signal: AbortSignal.timeout(30_000),
              });
              const body = await response.json();
              const failures = Array.isArray(body.checks)
                ? body.checks.filter((candidate) => candidate.status !== "ready")
                : [{ id: "missing_checks" }];
              assert.equal(response.status, 200, `Health endpoint returned HTTP ${response.status}.`);
              assert.equal(body.product, "market-iq", "Health endpoint reported the wrong product.");
              assert.equal(body.status, "ready", `Health endpoint reported ${body.status ?? "no status"}.`);
              assert.deepEqual(failures, [], `Blocked checks: ${failures.map((candidate) => candidate.id).join(", ")}`);
              return `Ready; source available through ${body.sourceAvailableThrough ?? "unavailable"}.`;
            });

            await check("public_doorway", "Public doorway", async () => {
              const response = await fetch(`${process.env.PREVIEW_ORIGIN}/market-iq/welcome`, {
                headers,
                signal: AbortSignal.timeout(30_000),
              });
              assert.equal(response.status, 200, `Welcome page returned HTTP ${response.status}.`);
              const body = await response.text();
              const renderedMarkup = body
                .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "")
                .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, "")
                .replace(/<template\b[^>]*>[\s\S]*?<\/template>/gi, "");
              const visibleText = renderedMarkup.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
              assert.match(visibleText, /Customer sign in/, "Welcome page is missing the Market IQ sign-in entry.");
              assert.doesNotMatch(visibleText, /Operator IQ|Portfolio IQ/, "Welcome page leaked another product identity.");
              return "Market IQ welcome page is reachable and product-isolated.";
            });

            await check("signed_out_return", "Signed-out return path", async () => {
              const destination = "/market-iq/daily?market=cleveland-oh";
              const response = await fetch(`${process.env.PREVIEW_ORIGIN}${destination}`, {
                headers,
                redirect: "manual",
                signal: AbortSignal.timeout(30_000),
              });
              assert.ok([302, 307].includes(response.status), `Protected route returned HTTP ${response.status}.`);
              const location = new URL(response.headers.get("location"), process.env.PREVIEW_ORIGIN);
              assert.equal(location.origin, process.env.PREVIEW_ORIGIN, "Sign-in redirect left the Market IQ origin.");
              assert.equal(location.pathname, "/sign-in", "Protected route did not redirect to Market IQ sign-in.");
              assert.equal(location.searchParams.get("redirect_url"), destination, "Sign-in redirect lost its destination.");
              return `Redirects to /sign-in and preserves ${destination}.`;
            });
          }

          const ready = checks.every((candidate) => candidate.ready);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\nchecks=${JSON.stringify(checks)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "",
            "## Market IQ stable preview",
            "",
            "| Check | State | Detail |",
            "| --- | --- | --- |",
            ...checks.map((candidate) => `| ${candidate.label} | ${candidate.ready ? "Ready" : "Blocked"} | ${candidate.detail.replaceAll("|", "\\|")} |`),
            "",
          ].join("\n"));

          if (!ready) {
            process.exitCode = 1;
          }
          NODE

      - name: Open, update, or resolve the incident
        id: incident
        if: always()
        uses: actions/github-script@v7
        env:
          AUTOMATION_CHECKS: ${{ steps.automation.outputs.checks }}
          PREVIEW_CHECKS: ${{ steps.preview.outputs.checks }}
        with:
          script: |
            function parseChecks(value, id, label) {
              try {
                const parsed = JSON.parse(value || "[]");
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
              } catch {}
              return [{ id, label, ready: false, detail: "The monitor did not produce a result." }];
            }

            const checks = [
              ...parseChecks(process.env.AUTOMATION_CHECKS, "automation_monitor", "Automation history"),
              ...parseChecks(process.env.PREVIEW_CHECKS, "preview_monitor", "Stable preview"),
            ];
            const failed = checks.filter((check) => !check.ready);
            const title = "[Market IQ] Stable preview incident";
            const markerPrefix = "<!-- market-iq-failure-monitor:";
            const fingerprint = failed.map((check) => check.id).sort().join(",") || "ready";
            const marker = `${markerPrefix}${fingerprint} -->`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const observedAt = new Date().toISOString();
            const escapeCell = (value) => String(value).replaceAll("|", "\\|").replaceAll("\n", " ");
            const body = [
              marker,
              "## Market IQ stable preview incident",
              "",
              `The automated monitor found ${failed.length} blocked check${failed.length === 1 ? "" : "s"} at ${observedAt}.`,
              "",
              "| Check | State | Detail |",
              "| --- | --- | --- |",
              ...checks.map((check) => `| ${escapeCell(check.label)} | ${check.ready ? "Ready" : "Blocked"} | ${escapeCell(check.detail)} |`),
              "",
              `Monitor run: ${runUrl}`,
              "",
              "This issue contains only sanitized operational state. Secret values and raw endpoint responses are never included.",
            ].join("\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const incident = issues.find((issue) =>
              !issue.pull_request
              && issue.title === title
              && issue.body?.includes(markerPrefix));

            if (failed.length > 0) {
              if (!incident) {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  assignees: [context.repo.owner],
                });
                core.notice(`Opened Market IQ incident #${created.data.number}.`);
              } else {
                const failureSetChanged = !incident.body?.includes(marker);
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: incident.number,
                  body,
                });
                if (failureSetChanged) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: incident.number,
                    body: `The blocked check set changed to: ${failed.map((check) => check.label).join(", ")}.\n\nMonitor run: ${runUrl}`,
                  });
                }
                core.notice(`Updated Market IQ incident #${incident.number}.`);
              }
              core.setOutput("active", "true");
              return;
            }

            if (incident) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                body: `All monitored Market IQ checks recovered at ${observedAt}.\n\nMonitor run: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: incident.number,
                state: "closed",
                state_reason: "completed",
              });
              core.notice(`Closed recovered Market IQ incident #${incident.number}.`);
            } else {
              core.notice("All Market IQ checks are healthy; no incident is open.");
            }
            core.setOutput("active", "false");

      - name: Fail while the incident is active
        if: always() && steps.incident.outputs.active == 'true'
        shell: bash
        run: |
          echo "The Market IQ incident remains active. See the linked GitHub issue for sanitized details."
          exit 1
