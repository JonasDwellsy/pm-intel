name: Market IQ stable preview identity

on:
  push:
    branches: [codex/market-iq-integration]
  workflow_dispatch:

concurrency:
  group: market-iq-stable-preview
  cancel-in-progress: true

jobs:
  verify:
    name: Stable preview serves integration HEAD
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_BRANCH: codex/market-iq-integration
      EXPECTED_SHA: ${{ github.sha }}
      IDENTITY_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq-deployment-identity
      HEALTH_URL: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app/api/market-iq-stable-preview-health
      PREVIEW_ORIGIN: https://market-iq-git-codex-market-iq-integration-dwellsybordo.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Require the preview automation credential
        run: |
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "MARKET_IQ_VERCEL_AUTOMATION_BYPASS_SECRET is not configured."
            exit 1
          fi

      - name: Wait for the stable preview to serve integration HEAD
        shell: bash
        run: |
          set -uo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --output "$response_file" --write-out '%{http_code}' \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$IDENTITY_URL" || true)"

            observed="$(node -e '
              const fs = require("node:fs");
              try {
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write([value.product ?? "", value.branch ?? "", value.commit ?? ""].join("\t"));
              } catch {
                process.stdout.write("\t\t");
              }
            ' "$response_file")"
            IFS=$'\t' read -r product branch commit <<< "$observed"

            if [ "$status" = "200" ] \
              && [ "$product" = "market-iq" ] \
              && [ "$branch" = "$EXPECTED_BRANCH" ] \
              && [ "$commit" = "$EXPECTED_SHA" ]; then
              echo "Stable Market IQ preview is serving $EXPECTED_BRANCH at $EXPECTED_SHA."
              exit 0
            fi

            echo "Attempt $attempt/30: HTTP ${status:-unreachable}; branch ${branch:-unavailable}; commit ${commit:-unavailable}."
            sleep 20
          done

          echo "Stable Market IQ preview did not converge to $EXPECTED_BRANCH at $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Verify the stable preview health contract
        shell: bash
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$HEALTH_URL")"

          HEALTH_STATUS="$status" HEALTH_RESPONSE_FILE="$response_file" node <<'NODE'
          const fs = require("node:fs");
          const response = JSON.parse(fs.readFileSync(process.env.HEALTH_RESPONSE_FILE, "utf8"));
          const failures = Array.isArray(response.checks)
            ? response.checks.filter((check) => check.status !== "ready")
            : [{ id: "missing_checks" }];
          if (process.env.HEALTH_STATUS !== "200" || response.product !== "market-iq" || response.status !== "ready" || failures.length) {
            console.error("Stable Market IQ preview health check failed.", {
              httpStatus: process.env.HEALTH_STATUS,
              product: response.product,
              status: response.status,
              failedChecks: failures.map((check) => check.id),
            });
            process.exit(1);
          }
          console.log("Stable Market IQ preview has a reachable evidence store and a current verified snapshot.");
          NODE

      - name: Verify the public doorway and signed-out return path
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          void (async () => {
            const origin = process.env.PREVIEW_ORIGIN;
            const headers = {
              "x-vercel-protection-bypass": process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
            };

            const welcome = await fetch(`${origin}/market-iq/welcome`, { headers });
            const welcomeBody = await welcome.text();
            assert.equal(welcome.status, 200, "Market IQ welcome page must load");
            const renderedMarkup = welcomeBody
              .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, "")
              .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, "")
              .replace(/<template\b[^>]*>[\s\S]*?<\/template>/gi, "");
            const visibleText = renderedMarkup
              .replace(/<[^>]+>/g, " ")
              .replace(/\s+/g, " ");
            assert.match(visibleText, /Customer sign in/);
            assert.doesNotMatch(visibleText, /Operator IQ|Portfolio IQ/);

            const destination = "/market-iq/daily?market=cleveland-oh";
            const protectedPage = await fetch(`${origin}${destination}`, {
              headers,
              redirect: "manual",
            });
            assert.ok([302, 307].includes(protectedPage.status), "Signed-out Daily Edition must redirect");
            const location = new URL(protectedPage.headers.get("location"), origin);
            assert.equal(location.origin, origin, "Sign-in must remain on the Market IQ origin");
            assert.equal(location.pathname, "/sign-in");
            assert.equal(location.searchParams.get("redirect_url"), destination);
            console.log("Market IQ public doorway and signed-out return path are healthy.");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
